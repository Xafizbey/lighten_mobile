# Xcode project for the Lighten student app. The .xcodeproj is generated from
# this file and is not kept in git:
#
#   brew install xcodegen
#   xcodegen
#   open Lighten.xcodeproj
name: Lighten
options:
  bundleIdPrefix: app.lighten
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '3'
    # Your Apple Developer team. Set it here or in Xcode, Signing & Capabilities.
    DEVELOPMENT_TEAM: ''
configs:
  Debug: debug
  Release: release
targets:
  Lighten:
    type: application
    platform: iOS
    sources:
      - path: Lighten
        excludes:
          - Resources/AppIcon.icon
          - Resources/AppIcon.icon/**
      # Icon Composer icon (Xcode 26 and iOS 26). Older systems use the PNG in
      # Assets.xcassets/AppIcon.appiconset, which has the same name.
      - path: Lighten/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    configFiles:
      Debug: Lighten/Config/Debug.xcconfig
      Release: Lighten/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lighten.ios
        PRODUCT_NAME: Lighten
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Lighten/Resources/Info.plist
    info:
      path: Lighten/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lighten
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Where the student cabinet lives; the app calls its /api, like the site.
        LightenBaseURL: $(LIGHTEN_BASE_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # Only for `pnpm dev` on this Mac (http://localhost). Production is HTTPS.
          NSAllowsLocalNetworking: true
  LightenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LightenTests
    dependencies:
      - target: Lighten
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lighten.ios.tests
schemes:
  Lighten:
    build:
      targets:
        Lighten: all
        LightenTests: [test]
    test:
      targets:
        - LightenTests
